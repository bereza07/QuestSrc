name: Desktop release

# Builds signed Tauri bundles for Windows / macOS / Linux and publishes them
# to a GitHub Release when you push a version tag (e.g. `v1.0.3`). The
# tauri-action also produces the `latest.json` manifest that the in-app
# updater reads.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          Private key from `npx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD Password you set for that key
#
# Trigger: `git tag v1.0.3 && git push origin v1.0.3`

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Repository-level GITHUB_TOKEN needs write access to Contents to draft the
# release and upload artifacts. Set at workflow level so every job inherits.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # v5 targets Node 24 natively; v4 targeted Node 20 which GitHub is
      # deprecating on 2025-09-19, causing internal `git` failures with 128.
      # fetch-depth: 0 grabs the full history + tags so tauri-action can find
      # the tag and derive the version reliably.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arches; no-op on Linux/Windows.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libglib2.0-dev libgtk-3-dev

      - name: Install npm deps
        run: npm ci

      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Draft the release; publish it once all three matrix jobs finish
          # and you've reviewed the artifacts on github.com. `latest.json`
          # is the manifest the in-app updater fetches.
          tagName: ${{ github.ref_name }}
          releaseName: "QuestForge ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG for details."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
